<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{{ config.title }}{% endblock title %}</title>
    {% block metadata %}{% endblock metadata %}
    <script src="{{ get_url(path='theme.js') }}"></script>
    <link rel="stylesheet" href="{{ get_url(path='style.css') }}">
</head>
<body class="mx-auto max-w-[52rem] bg-white px-5 py-8 text-zinc-800 antialiased dark:bg-zinc-950 dark:text-zinc-200 sm:px-8 sm:py-10 flex flex-col gap-6 sm:gap-8">
    <header class="flex flex-col gap-2">
        <div class="flex flex-col items-start gap-2 xs:flex-row xs:items-end">
            <a class="text-2xl font-semibold tracking-tight text-inherit" href="{{ config.base_url }}">{{ config.title }}</a>
            <button id="theme-toggle" type="button" class="flex shrink-0 cursor-pointer mb-0 xs:mb-0.5 sm:mb-1">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="size-6 sm:size-5 dark:hidden">
<path fill-rule="evenodd" d="M9.528 1.718a.75.75 0 0 1 .162.819A8.97 8.97 0 0 0 9 6a9 9 0 0 0 9 9 8.97 8.97 0 0 0 3.463-.69.75.75 0 0 1 .981.98 10.503 10.503 0 0 1-9.694 6.46c-5.799 0-10.5-4.7-10.5-10.5 0-4.368 2.667-8.112 6.46-9.694a.75.75 0 0 1 .818.162Z" clip-rule="evenodd" />
                </svg>
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="size-6 sm:size-5 hidden dark:inline">
<path d="M12 2.25a.75.75 0 0 1 .75.75v2.25a.75.75 0 0 1-1.5 0V3a.75.75 0 0 1 .75-.75ZM7.5 12a4.5 4.5 0 1 1 9 0 4.5 4.5 0 0 1-9 0ZM18.894 6.166a.75.75 0 0 0-1.06-1.06l-1.591 1.59a.75.75 0 1 0 1.06 1.061l1.591-1.59ZM21.75 12a.75.75 0 0 1-.75.75h-2.25a.75.75 0 0 1 0-1.5H21a.75.75 0 0 1 .75.75ZM17.834 18.894a.75.75 0 0 0 1.06-1.06l-1.59-1.591a.75.75 0 1 0-1.061 1.06l1.59 1.591ZM12 18a.75.75 0 0 1 .75.75V21a.75.75 0 0 1-1.5 0v-2.25A.75.75 0 0 1 12 18ZM7.758 17.303a.75.75 0 0 0-1.061-1.06l-1.591 1.59a.75.75 0 0 0 1.06 1.061l1.591-1.59ZM6 12a.75.75 0 0 1-.75.75H3a.75.75 0 0 1 0-1.5h2.25A.75.75 0 0 1 6 12ZM6.697 7.757a.75.75 0 0 0 1.06-1.06l-1.59-1.591a.75.75 0 0 0-1.061 1.06l1.59 1.591Z" />
                </svg>
            </button>
        </div>
        <nav class="flex flex-wrap gap-x-2 gap-y-1 text-base font-semibold">
            <a href="{{ get_url(path='@/about.md') }}">About</a>
            <a href="{{ get_url(path='@/works.md') }}">Works</a>
            <a href="{{ get_url(path='@/topics.md') }}">Topics</a>
            <a href="{{ get_url(path='@/search.md') }}">Search</a>
        </nav>
    </header>
    <main id="main">{% block content %}{% endblock content %}</main>
    <footer class="flex items-center gap-2 text-xs text-zinc-500 dark:text-zinc-400">
        <a class="text-inherit dark:text-inherit" href="https://github.com/junghyun397/blog/blob/master/LICENSE">CC0</a>
        <a class="text-inherit dark:text-inherit" href="https://github.com/junghyun397/blog">Repo</a>
        <a class="text-inherit dark:text-inherit" href="{{ config.base_url }}">do1ph.in</a>
    </footer>
</body>
</html>
